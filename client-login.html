
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:#071510;color:white;font-family:Arial,sans-serif;padding:20px
}
.login-box{
 width:100%;max-width:420px;background:#10251c;
 border:1px solid #254936;border-radius:18px;padding:35px;
 box-shadow:0 20px 60px #0006
}
.logo{font-size:35px;margin-bottom:20px}
h1{font-size:25px;margin-bottom:8px}
.subtitle{color:#94ad9e;font-size:13px;margin-bottom:25px}
label{display:block;font-size:13px;color:#c1d3c7;margin:17px 0 8px}
input{
 width:100%;padding:14px;background:#091b13;
 border:1px solid #31513f;border-radius:8px;
 color:white;outline:none;font-size:14px
}
input:focus{border-color:#37bd78}
button{
 width:100%;padding:14px;margin-top:24px;
 background:#20a765;color:white;border:0;
 border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
#message{margin-top:17px;font-size:13px;line-height:1.5}
.footer{text-align:center;color:#718e7e;font-size:11px;margin-top:25px}
</style>
</head>

<body>
<div class="login-box">
 <div class="logo">🏏</div>
 <h1>Client Admin Login</h1>
 <p class="subtitle">Sign in to manage your organization.</p>

 <form id="loginForm">
  <label>Email Address</label>
  <input type="email" id="email" placeholder="Enter your email" required>

  <label>Password</label>
  <input type="password" id="password" placeholder="Enter your password" required>

  <button type="submit" id="loginBtn">Sign In</button>
 </form>

 <div id="message"></div>
 <div class="footer">PLAYER AUCTION PLATFORM · CLIENT PORTAL</div>
</div>

<script>
const SUPABASE_URL = "https://jxanxkhjpadvmxjhupit.supabase.co";
const SUPABASE_KEY = "sb_publishable_VfvcHqVH67lH8ef-UYWjGQ_mHepMoYX";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

async function checkExistingSession(){
 const {data,error} = await db.auth.getSession();
 if(error || !data.session) return;

 const {data:membership,error:memberError} = await db
  .from("client_memberships")
  .select("client_id")
  .eq("user_id",data.session.user.id)
  .eq("role","client_admin")
  .maybeSingle();

 if(!memberError && membership){
  window.location.href="client-admin.html";
 }
}

checkExistingSession();

document.getElementById("loginForm").addEventListener("submit",async(e)=>{
 e.preventDefault();

 loginBtn.disabled=true;
 message.style.color="#f5c56b";
 message.textContent="Checking account...";

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const {data,error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  message.style.color="#ff7777";
  message.textContent=error.message;
  loginBtn.disabled=false;
  return;
 }

 const {data:membership,error:memberError}=await db
  .from("client_memberships")
  .select("client_id")
  .eq("user_id",data.user.id)
  .eq("role","client_admin")
  .maybeSingle();

 if(memberError || !membership){
  await db.auth.signOut();
  message.style.color="#ff7777";
  message.textContent="Access denied. Client Admin account required.";
  loginBtn.disabled=false;
  return;
 }

 message.style.color="#65e6a0";
 message.textContent="Login successful. Opening Client Dashboard...";

 window.location.href="client-admin.html";
});
</script>
</body>
</html>
