
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Auction Platform - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#101827;
  font-family:Arial,sans-serif;
  color:white;
  padding:20px;
}
.login-box{
  width:100%;
  max-width:400px;
  background:#1e293b;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 35px #0005;
}
h2{text-align:center;margin-top:0}
p{text-align:center;color:#94a3b8}
input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #475569;
  border-radius:8px;
  background:#0f172a;
  color:white;
  font-size:15px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:8px;
  background:#eab308;
  color:#111827;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
#message{
  text-align:center;
  margin-top:15px;
  color:#fca5a5;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>🏏 Player Auction</h2>
  <p>Sign in to your account</p>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" id="loginBtn">LOGIN</button>
  </form>

  <div id="message"></div>
</div>

<script>
const SUPABASE_URL = "https://jxanxkhjpadvmxjhupit.supabase.co";
const SUPABASE_KEY = "sb_publishable_VfvcHqVH67lH8ef-UYWjGQ_mHepMoYX";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
  const btn = document.getElementById("loginBtn");

  btn.disabled = true;
  btn.textContent = "PLEASE WAIT...";
  message.textContent = "";

  const {data, error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    message.textContent = error.message;
    btn.disabled = false;
    btn.textContent = "LOGIN";
    return;
  }

  const {data: isAdmin, error: adminError} =
    await db.rpc("is_platform_admin");

  if(adminError || isAdmin !== true){
    await db.auth.signOut();
    message.textContent = "Access denied. Admin account required.";
    btn.disabled = false;
    btn.textContent = "LOGIN";
    return;
  }

  window.location.href = "super-admin.html";
});
</script>

</body>
</html>
