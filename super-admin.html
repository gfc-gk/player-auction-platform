
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#17251d}
header{background:#123d2b;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h2{margin:0}
button{border:0;border-radius:7px;padding:11px 16px;cursor:pointer;font-weight:600}
.logout{background:#e74c3c;color:white}
.container{max-width:1250px;margin:25px auto;padding:0 16px}
.card{background:white;border-radius:12px;padding:22px;margin-bottom:22px;box-shadow:0 3px 14px #0000000c}
h3{margin:0 0 18px;color:#174a32}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
input,select{width:100%;padding:12px;border:1px solid #d4ddd7;border-radius:7px;font-size:14px;background:white}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.field{min-width:0}
.primary{background:#167447;color:white;margin-top:16px}
.primary:disabled{opacity:.6;cursor:not-allowed}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e8eee9;font-size:13px}
th{background:#edf5ef;color:#174a32;white-space:nowrap}
.search{max-width:400px;margin-bottom:15px}
.status{padding:5px 9px;border-radius:20px;font-size:12px;background:#e4f6e9;color:#167447}
.status.expired{background:#ffebeb;color:#c0392b}
.message{padding:12px;border-radius:7px;margin-top:12px;display:none;font-size:14px}
.error{background:#ffe9e9;color:#a52222}
.success{background:#e6f7ec;color:#17643b}
.muted{color:#718078;font-size:13px}
@media(max-width:650px){
 .form-grid{grid-template-columns:1fr}
 header{padding:16px}
 .card{padding:16px}
}
</style>
</head>
<body>

<header>
  <h2>Super Admin Dashboard</h2>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<div class="container">

  <section class="card">
    <h3>Create New Club</h3>

    <form id="clubForm">
      <div class="form-grid">

        <div class="field">
          <label>Club Name</label>
          <input id="club_name" required placeholder="Enter club name">
        </div>

        <div class="field">
          <label>Owner Name</label>
          <input id="owner_name" required placeholder="Enter owner name">
        </div>

        <div class="field">
          <label>Owner Email</label>
          <input id="owner_email" type="email" required placeholder="Enter email">
        </div>

        <div class="field">
          <label>Owner Mobile</label>
          <input id="owner_phone" required placeholder="Enter mobile number">
        </div>

        <div class="field">
          <label>Owner Password</label>
          <input id="owner_password" type="password" required minlength="6" placeholder="Minimum 6 characters">
        </div>

        <div class="field">
          <label>Plan Name</label>
          <input id="plan_name" required placeholder="Example: Premium">
        </div>

        <div class="field">
          <label>Subscription Amount</label>
          <input id="amount" type="number" min="0" step="0.01" required placeholder="Amount">
        </div>

        <div class="field">
          <label>Duration (Days)</label>
          <input id="duration_days" type="number" min="1" required placeholder="Example: 365">
        </div>

        <div class="field">
          <label>Subscription Start (India Time)</label>
          <input id="start_date" type="datetime-local" required>
        </div>

        <div class="field">
          <label>Subscription End (India Time)</label>
          <input id="end_date" type="datetime-local" required>
        </div>

      </div>

      <button class="primary" id="createBtn" type="submit">Create Club</button>
      <div id="formMessage" class="message"></div>
    </form>
  </section>

  <section class="card">
    <h3>Club Management</h3>
    <input class="search" id="clubSearch" placeholder="Search club, owner, email, mobile or ID...">

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Club Name</th>
            <th>Club ID</th>
            <th>Owner Name</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="clubTable">
          <tr><td colspan="6">Loading clubs...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="clubMessage" class="message"></div>
  </section>

  <section class="card">
    <h3>Subscription Management</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Club ID</th>
            <th>Plan</th>
            <th>Amount</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="subscriptionTable">
          <tr><td colspan="6">Loading subscriptions...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="subscriptionMessage" class="message"></div>
  </section>

</div>

<script>
const SUPABASE_URL = "https://jxanxkhjpadvmxjhupit.supabase.co";
const SUPABASE_KEY = "sb_publishable_VfvcHqVH67lH8ef-UYWjGQ_mHepMoYX";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allClubs = [];

function showMessage(id, message, type) {
  const el = document.getElementById(id);
  el.textContent = message;
  el.className = "message " + type;
  el.style.display = "block";
}

function hideMessage(id) {
  const el = document.getElementById(id);
  el.style.display = "none";
}

function formatDate(value) {
  if (!value) return "-";
  return new Date(value).toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata",
    dateStyle: "medium",
    timeStyle: "short"
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

async function checkAdmin() {
  const { data: sessionData, error: sessionError } =
    await db.auth.getSession();

  if (sessionError || !sessionData.session) {
    location.href = "index.html";
    return false;
  }

  const { data, error } = await db.rpc("is_platform_admin");

  if (error || data !== true) {
    alert("Access denied. Super Admin only.");
    await db.auth.signOut();
    location.href = "index.html";
    return false;
  }

  return true;
}

/* CLUB LIST */
async function loadClubs() {
  const tbody = document.getElementById("clubTable");
  tbody.innerHTML = '<tr><td colspan="6">Loading clubs...</td></tr>';
  hideMessage("clubMessage");

  const { data, error } = await db
    .from("clubs")
    .select(`
      id,
      club_name,
      owner_user_id,
      owner_email,
      created_at,
      profiles!clubs_owner_profile_fkey (
        full_name,
        phone
      )
    `)
    .order("created_at", { ascending: false });

  if (error) {
    tbody.innerHTML = '<tr><td colspan="6">Could not load clubs.</td></tr>';
    showMessage("clubMessage", error.message, "error");
    console.error("Club loading error:", error);
    return;
  }

  allClubs = data || [];
  renderClubs(allClubs);
}

function renderClubs(clubs) {
  const tbody = document.getElementById("clubTable");

  if (!clubs.length) {
    tbody.innerHTML = '<tr><td colspan="6">No clubs found.</td></tr>';
    return;
  }

  tbody.innerHTML = clubs.map(club => {
    const profile = club.profiles || {};

    return `
      <tr>
        <td><strong>${escapeHTML(club.club_name)}</strong></td>
        <td>${escapeHTML(club.id)}</td>
        <td>${escapeHTML(profile.full_name || "-")}</td>
        <td>${escapeHTML(profile.phone || "-")}</td>
        <td>${escapeHTML(club.owner_email || "-")}</td>
        <td>${escapeHTML(formatDate(club.created_at))}</td>
      </tr>
    `;
  }).join("");
}

/* CLUB SEARCH */
document.getElementById("clubSearch").addEventListener("input", function() {
  const query = this.value.toLowerCase().trim();

  const filtered = allClubs.filter(club => {
    const profile = club.profiles || {};

    return [
      club.club_name,
      club.id,
      club.owner_user_id,
      club.owner_email,
      profile.full_name,
      profile.phone
    ].some(value => String(value || "").toLowerCase().includes(query));
  });

  renderClubs(filtered);
});

/* CREATE CLUB */
function inputToISTISOString(value) {
  if (!value) return null;
  return new Date(value + ":00+05:30").toISOString();
}

document.getElementById("clubForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  hideMessage("formMessage");

  const startValue = document.getElementById("start_date").value;
  const endValue = document.getElementById("end_date").value;

  const startISO = inputToISTISOString(startValue);
  const endISO = inputToISTISOString(endValue);

  if (!startISO || !endISO || new Date(endISO) <= new Date(startISO)) {
    showMessage("formMessage", "End date must be later than start date.", "error");
    return;
  }

  const payload = {
    club_name: document.getElementById("club_name").value.trim(),
    owner_name: document.getElementById("owner_name").value.trim(),
    owner_email: document.getElementById("owner_email").value.trim(),
    owner_phone: document.getElementById("owner_phone").value.trim(),
    owner_password: document.getElementById("owner_password").value,
    plan_name: document.getElementById("plan_name").value.trim(),
    amount: Number(document.getElementById("amount").value),
    duration_days: Number(document.getElementById("duration_days").value),
    start_date: startISO,
    end_date: endISO
  };

  const button = document.getElementById("createBtn");
  button.disabled = true;
  button.textContent = "Creating...";

  try {
    const { data, error } = await db.functions.invoke("create-club", {
      body: payload
    });

    if (error) throw error;
    if (data && data.error) throw new Error(data.error);

    showMessage("formMessage", "Club created successfully!", "success");
    this.reset();

    await loadClubs();
    await loadSubscriptions();

  } catch (error) {
    console.error("Create club error:", error);
    let message = error.message || "Could not create club.";

    if (error.context && typeof error.context.json === "function") {
      try {
        const details = await error.context.json();
        if (details.error) message = details.error;
        else if (details.message) message = details.message;
      } catch (_) {}
    }

    showMessage("formMessage", message, "error");
  } finally {
    button.disabled = false;
    button.textContent = "Create Club";
  }
});

/* SUBSCRIPTIONS */
async function loadSubscriptions() {
  const tbody = document.getElementById("subscriptionTable");
  tbody.innerHTML = '<tr><td colspan="6">Loading subscriptions...</td></tr>';
  hideMessage("subscriptionMessage");

  const { data, error } = await db
    .from("subscriptions")
    .select("id, club_id, plan_name, amount, start_date, end_date, status")
    .order("created_at", { ascending: false });

  if (error) {
    tbody.innerHTML = '<tr><td colspan="6">Could not load subscriptions.</td></tr>';
    showMessage("subscriptionMessage", error.message, "error");
    console.error("Subscription loading error:", error);
    return;
  }

  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="6">No subscriptions found.</td></tr>';
    return;
  }

  const now = Date.now();

  tbody.innerHTML = data.map(sub => {
    const active = new Date(sub.start_date).getTime() <= now &&
                   new Date(sub.end_date).getTime() > now &&
                   sub.status === "active";

    return `
      <tr>
        <td>${escapeHTML(sub.club_id)}</td>
        <td>${escapeHTML(sub.plan_name)}</td>
        <td>₹${escapeHTML(sub.amount)}</td>
        <td>${escapeHTML(formatDate(sub.start_date))}</td>
        <td>${escapeHTML(formatDate(sub.end_date))}</td>
        <td>
          <span class="status ${active ? "" : "expired"}">
            ${active ? "Active" : "Expired / Inactive"}
          </span>
        </td>
      </tr>
    `;
  }).join("");
}

/* LOGOUT */
document.getElementById("logoutBtn").addEventListener("click", async function() {
  await db.auth.signOut();
  location.href = "index.html";
});

/* INITIALIZE */
(async function init() {
  const allowed = await checkAdmin();
  if (!allowed) return;

  await Promise.all([
    loadClubs(),
    loadSubscriptions()
  ]);
})();
</script>

</body>
</html>
